name: Build HackOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List repo root (debug)
        run: ls -la

      - name: Unpack HackOS.zip if present
        run: |
          if [ -f HackOS.zip ]; then
            echo "Found HackOS.zip — unpacking to ."
            sudo apt-get update -y
            sudo apt-get install -y unzip
            unzip -o HackOS.zip -d .
          else
            echo "HackOS.zip not found in repo root"
          fi

      - name: Ensure HackOS directory exists
        run: |
          if [ ! -d HackOS ]; then
            echo "ERROR: HackOS directory not found after unpack (or missing in branch)."
            echo "Either put HackOS/ in this branch, or run this workflow on the unpack/HackOS branch, or ensure HackOS.zip is present."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Build ISO
        working-directory: HackOS
        run: sudo bash ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: HackOS-ISO
          path: HackOS/hackos-amd64.hybrid.iso
