- name: Build ISO (debug)
  working-directory: HackOS
  run: |
    set -o pipefail
    echo "PWD: $(pwd)"
    echo "Listing HackOS:"
    ls -la || true
    echo
    if [ ! -f ./build.sh ]; then
      echo "ERROR: build.sh not found in HackOS/"
      echo "Files in HackOS:"
      ls -la
      exit 127
    fi
    echo "File info for build.sh:"
    file ./build.sh || true
    echo "--- head of build.sh (first 200 lines) ---"
    sed -n '1,200p' ./build.sh || true
    echo "--- end head ---"
    echo "Ensure build.sh is executable (setting +x):"
    chmod +x ./build.sh || true
    echo "Which bash:"
    which bash || true
    echo "Run build.sh with bash -x to trace commands:"
    sudo bash -x ./build.sh
    rc=$?
    echo "build.sh exit code: $rc"
    exit $rc
